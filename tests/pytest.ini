# Run with `pytest -c tests/pytest.ini` (or `uv run pytest` from the repo root, which the
# pyproject addopts redirect here). The repository root is the plugin package itself
# (__init__.py + plugin.yaml), so pytest's rootdir must be this directory: otherwise pytest
# collects the root as a package and imports __init__.py outside Hermes.
[pytest]
testpaths = .
